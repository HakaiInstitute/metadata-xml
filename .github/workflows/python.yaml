# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Create and validate and XML file

on: [push]

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs so a retargeted tag cannot
      # silently change what runs here. Trailing comment tracks the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # Needs >=0.10.12 for `uv audit`, and >=0.12.22 to write the
          # revision 5 lockfile without downgrading it on re-lock.
          version: "0.13.6"
      - name: Unzip CIOOS Schema
        run: unzip -o cioos-schema.zip
      - name: Install dependencies
        run: uv sync --dev
      - run: uv run ruff format --check
      - run: uv run ruff check
      - name: Audit dependencies for known vulnerabilities
        # `uv audit` is still gated as experimental; the flag opts in explicitly
        # rather than relying on the warning-only default.
        run: uv audit --preview-features audit-command
      - name: Test generating and validating a record
        run: uv run pytest .
